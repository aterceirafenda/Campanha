<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campanhas</title>
<style>
  :root { --bg: #e9e2cd; --fg: #3a3226; --card: #fbf6e8; --bd: #d3c6a3; --ac: #4f7a3a; --ac2: #b5683f; --ouro: #d9a73a; --sombra: rgba(70,52,28,.18); }
  @media (prefers-color-scheme: dark) { :root { --bg: #171d16; --fg: #ece3cd; --card: #232a20; --bd: #3f4a38; --ac: #8fc062; --ac2: #d98a5f; --ouro: #e6b84a; --sombra: rgba(0,0,0,.45); } }
  html, body { min-height: 100%; margin: 0; }
  body { display: flex; align-items: center; justify-content: center; background: radial-gradient(ellipse at 20% 0%, rgba(143,192,98,.28), transparent 55%), radial-gradient(ellipse at 90% 100%, rgba(217,167,58,.22), transparent 50%), var(--bg); background-attachment: fixed; color: var(--fg); font-family: Georgia, 'Palatino Linotype', serif; padding: 1rem; box-sizing: border-box; }
  main { width: 100%; max-width: 26rem; background: var(--card); border: 1px solid var(--bd); border-radius: 18px; padding: 2rem 1.5rem; text-align: center; box-shadow: 0 2px 0 var(--bd), 0 14px 30px var(--sombra); }
  h1 { margin: 0 0 .5rem; font-size: 1.55rem; letter-spacing: .01em; color: var(--ac); }
  h1::before { content: '\2B22\00a0'; color: var(--ouro); font-size: 1.1em; }
  h2 { color: var(--ac2); font-size: 1.2rem; }
  p { margin: .5rem 0; opacity: .8; }
  button { margin-top: 1rem; padding: .7rem 1.3rem; font: inherit; font-weight: 700; border: 1px solid var(--ac); background: var(--ac); color: #fffaf0; border-radius: 999px; cursor: pointer; box-shadow: 0 3px 0 rgba(0,0,0,.22); transition: transform .08s, box-shadow .08s, filter .15s; }
  button:hover { filter: brightness(1.08); }
  button:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.22); }
  button.sec { background: transparent; color: var(--fg); border-color: var(--bd); box-shadow: none; font-weight: 400; }
  button.sec:active { transform: none; }
  button.perigo { background: transparent; color: #b3412e; border-color: #b3412e; box-shadow: none; font-weight: 400; }
  .hide { display: none !important; }
  .form { display: flex; flex-direction: column; gap: .5rem; margin-top: 1rem; text-align: left; }
  input { font: inherit; padding: .65rem .8rem; border: 1px solid var(--bd); border-radius: 12px; background: var(--bg); color: var(--fg); }
  input:focus { outline: 2px solid var(--ac); outline-offset: 1px; }
  input[type=checkbox] { accent-color: var(--ac); width: 1.05rem; height: 1.05rem; padding: 0; }
  ul { list-style: none; padding: 0; margin: 1rem 0 0; text-align: left; }
  li { padding: .6rem .8rem; border: 1px solid var(--bd); border-radius: 12px; margin-bottom: .4rem; background: rgba(255,255,255,.35); }
  @media (prefers-color-scheme: dark) { li { background: rgba(255,255,255,.04); } }
  li small { display: block; opacity: .7; }
  main.wide { max-width: 32rem; }
  .bd { border-radius: 16px; overflow: hidden; margin-top: .5rem; border: 3px solid var(--bd); box-shadow: inset 0 0 40px rgba(40,70,30,.25), 0 4px 10px var(--sombra); background: radial-gradient(ellipse at 50% 8%, #e4f1fb 0%, #bfdcf2 22%, transparent 45%), radial-gradient(circle at 18% 70%, #b9dc8c 0%, transparent 40%), radial-gradient(circle at 82% 55%, #cfe49a 0%, transparent 38%), linear-gradient(#bfdcf2, #a7d27e 38%, #8fc062 100%); }
  svg { display: block; width: 100%; height: auto; }
  .trail { fill: none; stroke: #f3e7c4; stroke-width: 11; stroke-linecap: round; stroke-linejoin: round; opacity: .85; }
  .trail2 { fill: none; stroke: #c9ae78; stroke-width: 11; stroke-linecap: round; stroke-linejoin: round; opacity: .35; transform: translate(0, 2px); }
  .dot { fill: #fffaf0; stroke: #8c7a55; stroke-width: 1.2; }
  .dot.m { fill: #e0a030; stroke: #6b4300; stroke-width: 1.5; }
  .dot.a { fill: #fff; stroke: #1f6fd1; stroke-width: 2.5; animation: pl 1.1s infinite; }
  @keyframes pl { 50% { opacity: .4; } }
  .heart { fill: #e0453a; stroke: #fff; stroke-width: 1.5; }
  .heart.m { stroke: #ffd54a; stroke-width: 3; }
  .heart.a { stroke: #1f6fd1; stroke-width: 3; animation: pl 1.1s infinite; }
  .ic { font-size: 13px; text-anchor: middle; pointer-events: none; }
  #hist li { padding: .3rem .6rem; font-size: .85rem; margin-bottom: .25rem; }
  .hx { fill: #fff; font-size: 11px; text-anchor: middle; pointer-events: none; }
  .hex { fill: #6f7a66; stroke: #3b4636; stroke-width: 2.5; stroke-linejoin: round; filter: drop-shadow(0 3px 2px rgba(30,40,20,.35)); }
  .hex.l { stroke-dasharray: 5 4; opacity: .88; }
  .hexin { fill: none; stroke: rgba(255,255,255,.45); stroke-width: 1.5; stroke-linejoin: round; pointer-events: none; }
  .hex.u { fill: #a8761f; }
  .t { fill: #fffdf5; font-size: 12px; font-weight: 700; text-anchor: middle; pointer-events: none; paint-order: stroke; stroke: rgba(30,25,15,.55); stroke-width: 2.2px; stroke-linejoin: round; }
  .lbl { font-size: 14px; font-weight: 700; fill: #fffdf5; text-anchor: middle; paint-order: stroke; stroke: rgba(30,25,15,.6); stroke-width: 3px; stroke-linejoin: round; }
  #info { text-align: left; font-size: .9rem; }
  li.click { cursor: pointer; }
  .g { display: grid; grid-template-columns: 1fr 1fr; gap: .3rem; }
  .g li { margin: 0; padding: .4rem .5rem; font-size: .85rem; }
  .g label { display: flex; gap: .4rem; align-items: center; }
  h3 { text-align: left; margin: 1.2rem 0 .3rem; font-size: 1rem; color: var(--ac2); border-bottom: 2px dotted var(--bd); padding-bottom: .2rem; }
  #msg { color: #b3412e; min-height: 1.2em; font-size: .9rem; }
</style>
</head>
<body>
<main>
  <h1>Dorf Romantik: Campanha</h1>

  <section id="out" class="hide">
    <p>Entre para ver e criar suas campanhas.</p>
    <button id="login">Entrar com Google</button>
  </section>

  <section id="in" class="hide">
    <p>Olá, <strong id="nome"></strong>!</p>
    <p id="camps">Carregando campanhas…</p>
    <ul id="lista"></ul>
    <div class="form">
      <input id="cnome" placeholder="Nome da campanha" maxlength="60">
      <input id="cjog" placeholder="Jogadores (opcional)" maxlength="120">
      <button id="criar">Nova campanha</button>
    </div>
    <button class="sec" id="logout">Sair</button>
  </section>

  <section id="board" class="hide">
    <h2 id="bt" style="margin:0"></h2>
    <div class="bd"><svg id="svg" viewBox="410 -15 590 825"></svg></div>
    <div id="info"></div>
    <div class="form" id="rp">
      <input id="pont" type="number" inputmode="numeric" min="0" placeholder="Pontuação da partida">
      <p id="prev" style="margin:0"></p>
      <button id="reg">Registrar partida</button>
    </div>
    <h3 id="ht" class="hide">Partidas</h3>
    <ul id="hist"></ul>
    <button class="sec hide" id="histmais">Ver todas</button>
    <h3>Suas Conquistas</h3>
    <ul id="conq" class="g"></ul>
    <h3>Caixas</h3>
    <ul id="cx" class="g"></ul>
    <div id="cv">
      <h3>Convidar</h3>
      <div class="form">
        <input id="cemail" type="email" placeholder="E-mail do convidado (opcional)">
        <button id="cgerar">Gerar link de convite</button>
      </div>
      <ul id="clist"></ul>
      <p id="cmem" style="font-size:.9rem"></p>
    </div>
    <button class="sec hide" id="sair">Sair desta campanha</button>
    <button class="sec" id="undo">Desfazer último</button>
    <button class="sec" id="back">Voltar</button>
    <button class="perigo hide" id="delcamp">Excluir campanha</button>
  </section>

  <p id="msg"></p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
  const SUPABASE_URL = "https://ffksrrnwuweudtylzszt.supabase.co";
  const SUPABASE_KEY = "sb_publishable_f4BiABsxLXgt7EdEE3yzyA_wmKGiYgP";
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const $ = id => document.getElementById(id);

  (function () {
    const t = new URLSearchParams(location.search).get("convite");
    if (t) { try { localStorage.setItem("convite", t); } catch (e) {} history.replaceState(null, "", location.pathname); }
  })();
  const tokenGuardado = () => { try { return localStorage.getItem("convite"); } catch (e) { return null; } };
  let uid = null, camps = [], cur = null, order = [];
  const A = 56, H = 48.5, D0 = 15, MG = 4;
  const SEGS = [["Andarilho","Caixa 1",2,[0,1]],["Caixa 1","Caixa 2",5,[-1,0]],["Caixa 2","Circo",4,[0,1]],["Caixa 2","Armazém",4,[0,1]],["Circo","Cervo",6,[1,0]],["Cervo","Castelo",8,[1,0]],["Castelo","Fazenda",10,[1,0]],["Fazenda","Nuvens",10,[1,-1]],["Armazém","Túnel de Cereal",6,[-1,0]],["Túnel de Cereal","Túnel de Vila",8,[-1,0]],["Túnel de Vila","Túnel de Floresta",10,[-1,0]],["Túnel de Floresta","Nuvens",10,[-1,-1]],["Circo","Sinaleiro",6,[0,1]],["Armazém","Sinaleiro",6,[0,1]],["Sinaleiro","Pastora",8,[1,0]],["Pastora","Colina",10,[-1,0]],["Colina","Nuvens",10,[1,0]]];
  const BIOMA = {"Castelo":"#7d8494","Circo":"#b9483a","Nuvens":"#4f8fc0","Cervo":"#4f7a3a","Fazenda":"#b9861f","Túnel de Floresta":"#2f5a3a","Túnel de Cereal":"#a9822c","Túnel de Vila":"#b5683f","Colina":"#6d9a3a","Pastora":"#5f9a4c","Sinaleiro":"#a35d4c","Armazém":"#8b6b43"};
  const HEART = new Set(["Cervo>Castelo","Túnel de Cereal>Túnel de Vila","Sinaleiro>Pastora"]);
  const POS = {"Andarilho":[790,772],"Caixa 1":[700,733],"Caixa 2":[700,598],"Circo":[866,598],"Armazém":[533,598],"Cervo":[866,466],"Sinaleiro":[700,466],"Túnel de Cereal":[533,466],"Castelo":[866,335],"Pastora":[700,335],"Túnel de Vila":[533,335],"Fazenda":[866,203],"Colina":[700,203],"Túnel de Floresta":[533,203],"Nuvens":[700,72]};
  const dentro = (p, c, s) => { const dx = Math.abs(p[0] - c[0]), dy = Math.abs(p[1] - c[1]); return dy <= s * 0.866 && dx * 1.732 + dy <= s * 1.732; };
  function curva(f, t, c, sg) {
    const a = POS[f], b = POS[t], dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy);
    const cx = (a[0] + b[0]) / 2 - dy / L * c * sg, cy = (a[1] + b[1]) / 2 + dx / L * c * sg;
    const P = [], cum = [0];
    for (let k = 0; k <= 300; k++) {
      const u = k / 300, w = 1 - u;
      P.push([w * w * a[0] + 2 * w * u * cx + u * u * b[0], w * w * a[1] + 2 * w * u * cy + u * u * b[1]]);
      if (k) cum.push(cum[k - 1] + Math.hypot(P[k][0] - P[k - 1][0], P[k][1] - P[k - 1][1]));
    }
    const fora = (p, h) => h === "Andarilho" ? Math.hypot(p[0] - POS[h][0], p[1] - POS[h][1]) > 14 : !dentro(p, POS[h], A + MG);
    let s0 = 0, e0 = 300;
    while (s0 < 300 && !fora(P[s0], f)) s0++;
    while (e0 > 0 && !fora(P[e0], t)) e0--;
    return { P, cum, s0, e0, len: cum[e0] - cum[s0] };
  }
  function geo(f, t, n, hint, D) {
    const a = POS[f], b = POS[t], dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy);
    const sg = (-dy / L * hint[0] + dx / L * hint[1]) >= 0 ? 1 : -1;
    let r = curva(f, t, 0, sg);
    if (r.len < n * D) {
      let lo = 0, hi = 500;
      for (let i = 0; i < 30; i++) { const m = (lo + hi) / 2; r = curva(f, t, m, sg); if (r.len < n * D) lo = m; else hi = m; }
    }
    const out = [];
    for (let i = 0; i < n; i++) {
      const tg = r.cum[r.s0] + (r.cum[r.e0] - r.cum[r.s0]) * (i + 0.5) / n;
      let j = 0; while (j < 300 && r.cum[j] < tg) j++;
      out.push(r.P[j]);
    }
    return out;
  }
  const DG = Math.max(D0, ...SEGS.map(([f, t, n, h]) => curva(f, t, 0, 1).len / n));
  const CP = SEGS.map(([f, t, n, h]) => geo(f, t, n, h, DG));
  const rotulo = h => (h.startsWith("Caixa") ? "Abra a|" + h : "Carta de|Conquista|" + h.replace("Túnel de ", "Túnel de|")).split("|");
  const NS = "http://www.w3.org/2000/svg";
  const el = (t, at, parent, txt) => { const e = document.createElementNS(NS, t); for (const k in at) e.setAttribute(k, at[k]); if (txt) e.textContent = txt; parent.appendChild(e); return e; };
  const cid = (f, t, i) => f + ">" + t + ":" + i;
  const TAB = [[400,"Imperatriz",15],[375,"Príncipe Herdeiro",15],[350,"Baronesa",15],[340,"Magnata",14],[330,"Conselheiro",14],[320,"Prefeito",13],[310,"Fabricante",13],[300,"Balonista",12],[290,"Diplomata",12],[280,"Médico",11],[270,"Astrônomo",11],[260,"Inventor",10],[250,"Arquiteto",10],[240,"Comerciante",9],[230,"Fotógrafo",9],[220,"Chefe de Estação",8],[210,"Chefe do Porto",8],[200,"Capitão",7],[190,"Mestre de Cerimônias",7],[180,"Engenheiro",6],[170,"Esposa de Fazendeiro",6],[160,"Guarda Florestal",5],[150,"Proprietária",5],[140,"Atriz",4],[130,"Vigia Noturno",4],[120,"Cocheiro",3],[110,"Pescadora",3],[100,"Jornaleiro",2],[0,"Vagabundo",1]];
  const linha = pt => TAB.find(r => pt >= r[0]);
  let plays = [], caixas = [], verTodas = false;
  const nomeH = h => h.startsWith("Caixa") ? h : "Carta de Conquista " + h;

  function show(w) {
    $("out").classList.toggle("hide", w !== "out");
    $("in").classList.toggle("hide", w !== "in");
    $("board").classList.toggle("hide", w !== "board");
    document.querySelector("main").classList.toggle("wide", w === "board");
  }

  async function render(session) {
    if (!session) { uid = null; cur = null; show("out"); if (tokenGuardado()) $("msg").textContent = "Você recebeu um convite! Entre com o Google pra aceitar."; return; }
    const u = session.user;
    uid = u.id;
    $("nome").textContent = (u.user_metadata && (u.user_metadata.name || u.user_metadata.full_name)) || u.email;
    if (cur) return;
    const tk = tokenGuardado();
    let aviso = "";
    if (tk) {
      try { localStorage.removeItem("convite"); } catch (e) {}
      const { error } = await sb.rpc("accept_invite", { invite_token: tk });
      aviso = error ? (/another email/.test(error.message) ? "Esse convite é de outro e-mail." : "Convite inválido ou expirado.") : "Você entrou na campanha!";
    }
    show("in");
    await carregar();
    if (aviso) $("msg").textContent = aviso;
  }

  async function carregar() {
    const { data, error } = await sb.from("campaigns").select("id,name,players,owner_id,state").order("created_at", { ascending: false });
    if (error) { $("camps").textContent = ""; $("msg").textContent = "Erro ao ler campanhas: " + error.message; return; }
    camps = data;
    $("camps").textContent = data.length ? "Toque numa campanha pra abrir o tabuleiro." : "Nenhuma campanha ainda.";
    const ul = $("lista");
    ul.innerHTML = "";
    data.forEach(c => {
      const li = document.createElement("li");
      li.className = "click";
      li.textContent = c.name;
      if (c.players) { const sm = document.createElement("small"); sm.textContent = c.players; li.appendChild(sm); }
      li.onclick = () => abrir(c);
      ul.appendChild(li);
    });
  }

  async function abrir(c) {
    cur = c; plays = [];
    caixas = (c.state && Array.isArray(c.state.caixas)) ? c.state.caixas.slice() : [];
    order = (c.state && Array.isArray(c.state.marked)) ? c.state.marked.slice() : [];
    $("bt").textContent = c.name;
    $("msg").textContent = c.owner_id === uid ? "" : "Você é convidado: só visualiza.";
    $("pont").value = ""; $("prev").textContent = "";
    verTodas = false;
    show("board");
    draw();
    $("bt").scrollIntoView({ behavior: "smooth", block: "start" });
    const { data, error } = await sb.from("plays").select("number,created_at,data").eq("campaign_id", c.id).order("number");
    if (error) { $("msg").textContent = "Erro ao ler partidas: " + error.message; return; }
    plays = data;
    draw();
    if (c.owner_id === uid) await carregarConvites();
  }

  function draw() {
    const M = new Set(order);
    const reached = h => h === "Andarilho" || SEGS.some(([f, t, n]) => t === h && M.has(cid(f, t, n - 1)));
    const canEdit = cur.owner_id === uid;
    const cred = plays.reduce((t, q) => t + ((q.data && q.data.circulos) || 0), 0) - order.length;
    const svg = $("svg");
    svg.innerHTML = "";
    SEGS.forEach(([f, t, n], si) => {
      const pts = [POS[f]].concat(CP[si], [POS[t]]).map(q => q[0] + "," + q[1]).join(" ");
      el("polyline", { points: pts, class: "trail2" }, svg);
      el("polyline", { points: pts, class: "trail" }, svg);
    });
    SEGS.forEach(([f, t, n], si) => {
      const heart = HEART.has(f + ">" + t);
      for (let i = 0; i < n; i++) {
        const [x, y] = CP[si][i], id = cid(f, t, i), m = M.has(id);
        const av = !m && cred > 0 && (i === 0 ? reached(f) : M.has(cid(f, t, i - 1)));
        const st = m ? " m" : av ? " a" : "";
        if (heart && i === 3) { el("circle", { cx: x, cy: y, r: 8, class: "heart" + st }, svg); el("text", { x: x, y: y + 4, class: "hx" }, svg, "♥"); }
        else el("circle", { cx: x, cy: y, r: av ? 7 : 5, class: "dot" + st }, svg);
        if (av && canEdit) { const hit = el("circle", { cx: x, cy: y, r: 18, fill: "transparent", style: "cursor:pointer" }, svg); hit.onclick = () => marcar(id); }
      }
    });
    Object.keys(POS).forEach(h => {
      const [x, y] = POS[h];
      if (h === "Andarilho") {
        el("circle", { cx: x, cy: y, r: 11, fill: "#3b5ba8", stroke: "#fff", "stroke-width": 2 }, svg);

      }
      const pts = [[56,0],[28,48.5],[-28,48.5],[-56,0],[-28,-48.5],[28,-48.5]].map(q => (x + q[0]) + "," + (y + q[1])).join(" ");
      const ok = reached(h);
      el("polygon", { points: pts, class: "hex" + (ok ? "" : " l"), style: ok ? "fill:" + (BIOMA[h] || "#a8761f") : "" }, svg);
      const pin = [[48,0],[24,41.5],[-24,41.5],[-48,0],[-24,-41.5],[24,-41.5]].map(q => (x + q[0]) + "," + (y + q[1])).join(" ");
      el("polygon", { points: pin, class: "hexin" }, svg);
      el("text", { x: x, y: y - 31, class: "ic" }, svg, reached(h) ? "👑" : "🔒");
      const ls = rotulo(h), y0 = y - (ls.length - 1) * 6.75 + 4;
      ls.forEach((tx, i) => el("text", { x: x, y: y0 + i * 13.5, class: "t" }, svg, tx));
    });
    const hearts = order.filter(id => HEART.has(id.split(":")[0]) && id.endsWith(":3")).length;
    const desb = Object.keys(POS).filter(h => h !== "Andarilho" && reached(h)).map(nomeH);
    $("info").innerHTML = "";
    const l1 = document.createElement("p"); l1.textContent = "Disponíveis pra marcar: " + Math.max(cred, 0) + " · Marcados: " + order.length + "/123 · Corações: " + hearts + "/3"; $("info").appendChild(l1);
    const l2 = document.createElement("p"); l2.textContent = "Desbloqueados: " + (desb.length ? desb.join(", ") : "nada ainda"); $("info").appendChild(l2);
    $("undo").classList.toggle("hide", !canEdit);
    $("rp").classList.toggle("hide", !canEdit);
    $("cv").classList.toggle("hide", !canEdit);
    $("sair").classList.toggle("hide", canEdit);
    $("delcamp").classList.toggle("hide", !canEdit);

    const CONQ = ["Castelo","Circo","Nuvens","Cervo","Fazenda","Túnel de Floresta","Túnel de Cereal","Colina","Pastora","Sinaleiro","Túnel de Vila","Armazém"];
    const CX = ["Local Lanç. de Balões","Canteiro de Obras","Festival de Bandeiras","Cabana na Floresta","Coração Dourado","Porto","Festival da Colheita","Desejo do Coração","Locomotiva","Na Estrada p/o Sucesso","Corações Vermelhos","Navio","Estação de Trem","Torre de Vigia"];
    const item = (ul, nome, on, dis, fn) => { const li = document.createElement("li"), lb = document.createElement("label"), ck = document.createElement("input"); ck.type = "checkbox"; ck.checked = on; ck.disabled = dis; if (fn) ck.onchange = fn; lb.appendChild(ck); lb.appendChild(document.createTextNode(nome)); li.appendChild(lb); ul.appendChild(li); };

    CONQ.forEach(n => item($("conq"), n, reached(n), true));
    CX.forEach(n => { const auto = n === "Corações Vermelhos"; item($("cx"), n, auto ? hearts > 0 : caixas.includes(n), auto || !canEdit, () => alternarCaixa(n)); });
    $("hist").innerHTML = "";
    const lista = plays.slice().sort((a, b) => b.number - a.number);
    const vis = verTodas ? lista : lista.slice(0, 5);
    $("ht").textContent = "Partidas (" + plays.length + ")";
    $("ht").classList.toggle("hide", !plays.length);
    $("histmais").classList.toggle("hide", plays.length <= 5);
    $("histmais").textContent = verTodas ? "Ver só as últimas 5" : "Ver todas (" + plays.length + ")";
    vis.forEach(q => {
      const li = document.createElement("li");
      li.textContent = "Partida " + q.number + " (" + (q.created_at ? new Date(q.created_at).toLocaleDateString("pt-BR") : "") + "): " + q.data.pontuacao + " pts, " + q.data.titulo + " (+" + q.data.circulos + ") ";
      if (canEdit) { const bt = document.createElement("button"); bt.className = "sec"; bt.style.cssText = "margin:0 0 0 .4rem;padding:.2rem .6rem;font-size:.8rem"; bt.textContent = "Excluir"; bt.onclick = () => excluir(q, cred); li.appendChild(bt); }
      $("hist").appendChild(li);
    });
  }

  async function salvar(antes) {
    const { error } = await sb.from("campaigns").update({ state: { ...(cur.state || {}), marked: order, caixas } }).eq("id", cur.id);
    if (error) { order = antes; $("msg").textContent = "Erro ao salvar: " + error.message; }
    else { cur.state = { ...(cur.state || {}), marked: order.slice(), caixas: caixas.slice() }; $("msg").textContent = ""; }
    draw();
  }
  async function alternarCaixa(n) {
    const antes = caixas.slice();
    caixas = caixas.includes(n) ? caixas.filter(x => x !== n) : caixas.concat(n);
    draw();
    const novo = { ...(cur.state || {}), marked: order, caixas };
    const { error } = await sb.from("campaigns").update({ state: novo }).eq("id", cur.id);
    if (error) { caixas = antes; $("msg").textContent = "Erro ao salvar: " + error.message; }
    else { cur.state = { ...novo, caixas: caixas.slice() }; $("msg").textContent = ""; }
    draw();
  }
  async function marcar(id) { const antes = order.slice(); order.push(id); draw(); await salvar(antes); }
  async function excluir(q, cred) {
    const falta = q.data.circulos - cred;
    if (falta > 0) { $("msg").textContent = "Pra excluir essa partida, desfaça antes " + falta + " círculo(s) marcado(s)."; return; }
    if (!confirm("Excluir a partida " + q.number + " (" + q.data.pontuacao + " pts)?")) return;
    const { error } = await sb.from("plays").delete().eq("campaign_id", cur.id).eq("number", q.number);
    if (error) { $("msg").textContent = "Erro ao excluir: " + error.message; return; }
    plays = plays.filter(x => x.number !== q.number);
    $("msg").textContent = "";
    draw();
  }
  let convites = [];
  const linkConvite = t => location.origin + location.pathname + "?convite=" + t;
  async function copiar(txt) {
    try { await navigator.clipboard.writeText(txt); $("msg").textContent = "Link copiado!"; }
    catch (e) { prompt("Copie o link:", txt); }
  }
  function mostrarConvites() {
    const ul = $("clist");
    ul.innerHTML = "";
    convites.forEach(cv => {
      const li = document.createElement("li");
      li.textContent = (cv.email || "Qualquer pessoa com o link") + " · expira em " + new Date(cv.expires_at).toLocaleDateString("pt-BR");
      const b1 = document.createElement("button"); b1.className = "sec"; b1.style.cssText = "margin:.4rem .4rem 0 0;padding:.3rem .7rem;font-size:.8rem"; b1.textContent = "Copiar link"; b1.onclick = () => copiar(linkConvite(cv.token));
      const b2 = document.createElement("button"); b2.className = "sec"; b2.style.cssText = b1.style.cssText; b2.textContent = "Revogar"; b2.onclick = () => revogar(cv);
      li.appendChild(document.createElement("br")); li.appendChild(b1); li.appendChild(b2);
      ul.appendChild(li);
    });
  }
  async function carregarConvites() {
    const r1 = await sb.from("campaign_invites").select("id,token,email,expires_at").eq("campaign_id", cur.id).gt("expires_at", new Date().toISOString()).order("created_at", { ascending: false });
    if (r1.error) { $("msg").textContent = "Erro ao ler convites: " + r1.error.message; return; }
    convites = r1.data; mostrarConvites();
    const r2 = await sb.from("campaign_members").select("user_id").eq("campaign_id", cur.id);
    $("cmem").textContent = r2.error ? "" : (r2.data.length + " convidado(s) na campanha.");
  }
  async function revogar(cv) {
    if (!confirm("Revogar este convite? O link para de funcionar.")) return;
    const { error } = await sb.from("campaign_invites").delete().eq("id", cv.id);
    if (error) { $("msg").textContent = "Erro ao revogar: " + error.message; return; }
    convites = convites.filter(x => x.id !== cv.id); mostrarConvites();
  }
  $("cgerar").onclick = async () => {
    $("msg").textContent = "";
    const em = $("cemail").value.trim();
    const { data, error } = await sb.from("campaign_invites").insert({ campaign_id: cur.id, email: em || null }).select("id,token,email,expires_at").single();
    if (error) { $("msg").textContent = "Erro ao gerar convite: " + error.message; return; }
    convites.unshift(data); mostrarConvites(); $("cemail").value = "";
    await copiar(linkConvite(data.token));
  };
  $("sair").onclick = async () => {
    if (!confirm("Sair desta campanha? Você perde o acesso até receber outro convite.")) return;
    const { error } = await sb.from("campaign_members").delete().eq("campaign_id", cur.id).eq("user_id", uid);
    if (error) { $("msg").textContent = "Erro ao sair: " + error.message; return; }
    cur = null; $("msg").textContent = ""; show("in"); await carregar();
  };
  $("delcamp").onclick = async () => {
    if (!cur || cur.owner_id !== uid) return;
    if (!confirm('Excluir a campanha "' + cur.name + '"?\n\nIsso apaga todas as partidas, marcações e convites, e os convidados perdem o acesso. Não dá pra desfazer.')) return;
    const { data, error } = await sb.from("campaigns").delete().eq("id", cur.id).select("id");
    if (error) { $("msg").textContent = "Erro ao excluir: " + error.message; return; }
    if (!data || !data.length) { $("msg").textContent = "Não foi possível excluir a campanha."; return; }
    cur = null; $("msg").textContent = "Campanha excluída."; show("in"); await carregar();
    $("msg").textContent = "Campanha excluída.";
  };
  $("histmais").onclick = () => { verTodas = !verTodas; draw(); };
  $("pont").oninput = () => {
    const v = parseInt($("pont").value, 10);
    $("prev").textContent = isNaN(v) || v < 0 ? "" : linha(v)[0] + " " + linha(v)[1] + ": " + linha(v)[2] + " círculo(s)";
  };
  $("reg").onclick = async () => {
    const v = parseInt($("pont").value, 10);
    if (isNaN(v) || v < 0) { $("msg").textContent = "Digite a pontuação (número)."; return; }
    const r = linha(v), number = plays.length ? Math.max(...plays.map(q => q.number)) + 1 : 1;
    const data = { pontuacao: v, linha: r[0], titulo: r[1], circulos: r[2] };
    const { data: nova, error } = await sb.from("plays").insert({ campaign_id: cur.id, number, data }).select("number,created_at,data").single();
    if (error) { $("msg").textContent = "Erro ao registrar: " + error.message; return; }
    plays.push(nova);
    $("pont").value = ""; $("prev").textContent = ""; $("msg").textContent = "";
    draw();
  };
  $("undo").onclick = async () => { if (!order.length) return; const antes = order.slice(); order.pop(); draw(); await salvar(antes); };
  $("back").onclick = async () => { cur = null; $("msg").textContent = ""; show("in"); await carregar(); };

  $("criar").onclick = async () => {
    $("msg").textContent = "";
    const name = $("cnome").value.trim();
    if (!name) { $("msg").textContent = "Dê um nome à campanha."; return; }
    const { error } = await sb.from("campaigns").insert({ game: "dorf-romantik", name, players: $("cjog").value.trim() || null });
    if (error) { $("msg").textContent = "Erro ao criar: " + error.message; return; }
    $("cnome").value = ""; $("cjog").value = "";
    await carregar();
  };

  $("login").onclick = async () => {
    $("msg").textContent = "";
    const { error } = await sb.auth.signInWithOAuth({
      provider: "google",
      options: { redirectTo: location.origin + location.pathname }
    });
    if (error) $("msg").textContent = error.message;
  };
  $("logout").onclick = () => sb.auth.signOut();

  sb.auth.onAuthStateChange((_e, session) => render(session));
  sb.auth.getSession().then(({ data }) => render(data.session));
</script>
</body>
</html>
