<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campanhas</title>
<style>
  :root { --bg: #f4efe4; --fg: #3b3226; --card: #fffaf0; --bd: #d8ccb2; --ac: #8a5a2b; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1f1b15; --fg: #e8dfcc; --card: #2a251d; --bd: #4a4132; --ac: #d9a45f; } }
  html, body { min-height: 100%; margin: 0; }
  body { display: flex; align-items: center; justify-content: center; background: var(--bg); color: var(--fg); font-family: Georgia, serif; padding: 1rem; box-sizing: border-box; }
  main { width: 100%; max-width: 26rem; background: var(--card); border: 1px solid var(--bd); border-radius: 12px; padding: 2rem 1.5rem; text-align: center; }
  h1 { margin: 0 0 .5rem; font-size: 1.5rem; }
  p { margin: .5rem 0; opacity: .8; }
  button { margin-top: 1rem; padding: .7rem 1.2rem; font: inherit; border: 1px solid var(--ac); background: var(--ac); color: var(--bg); border-radius: 8px; cursor: pointer; }
  button.sec { background: transparent; color: var(--fg); border-color: var(--bd); }
  .hide { display: none; }
  .form { display: flex; flex-direction: column; gap: .5rem; margin-top: 1rem; text-align: left; }
  input { font: inherit; padding: .6rem; border: 1px solid var(--bd); border-radius: 8px; background: var(--bg); color: var(--fg); }
  ul { list-style: none; padding: 0; margin: 1rem 0 0; text-align: left; }
  li { padding: .6rem .8rem; border: 1px solid var(--bd); border-radius: 8px; margin-bottom: .4rem; }
  li small { display: block; opacity: .7; }
  main.wide { max-width: 32rem; }
  .bd { border-radius: 12px; overflow: hidden; background: linear-gradient(#8fc1ec, #cfe5f6 55%, #a9d18a 100%); margin-top: .5rem; }
  svg { display: block; width: 100%; height: auto; }
  .dot { fill: #fff; stroke: #7d93a8; stroke-width: 1; }
  .dot.m { fill: #e0a030; stroke: #7a5200; }
  .dot.a { fill: #fff; stroke: #1f6fd1; stroke-width: 2.5; animation: pl 1.1s infinite; }
  @keyframes pl { 50% { opacity: .4; } }
  .heart { fill: #e0453a; stroke: #fff; stroke-width: 1.5; }
  .heart.m { stroke: #ffd54a; stroke-width: 3; }
  .heart.a { stroke: #1f6fd1; stroke-width: 3; animation: pl 1.1s infinite; }
  .hx { fill: #fff; font-size: 8px; text-anchor: middle; pointer-events: none; }
  .hex { fill: #46443f; stroke: #2b2a26; stroke-width: 2; }
  .hex.u { fill: #a8761f; }
  .t { fill: #fff; font-size: 9.5px; font-weight: 700; text-anchor: middle; pointer-events: none; }
  .lbl { font-size: 11px; font-weight: 700; fill: #2b2a26; text-anchor: middle; }
  #info { text-align: left; font-size: .9rem; }
  li.click { cursor: pointer; }
  #msg { color: #b3412e; min-height: 1.2em; font-size: .9rem; }
</style>
</head>
<body>
<main>
  <h1>Dorf Romantik: Campanha</h1>

  <section id="out" class="hide">
    <p>Entre para ver e criar suas campanhas.</p>
    <button id="login">Entrar com Google</button>
  </section>

  <section id="in" class="hide">
    <p>Olá, <strong id="nome"></strong>!</p>
    <p id="camps">Carregando campanhas…</p>
    <ul id="lista"></ul>
    <div class="form">
      <input id="cnome" placeholder="Nome da campanha" maxlength="60">
      <input id="cjog" placeholder="Jogadores (opcional)" maxlength="120">
      <button id="criar">Nova campanha</button>
    </div>
    <button class="sec" id="logout">Sair</button>
  </section>

  <section id="board" class="hide">
    <h2 id="bt" style="margin:0"></h2>
    <div class="bd"><svg id="svg" viewBox="0 0 600 880"></svg></div>
    <div id="info"></div>
    <button class="sec" id="undo">Desfazer último</button>
    <button class="sec" id="back">Voltar</button>
  </section>

  <p id="msg"></p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
  const SUPABASE_URL = "https://ffksrrnwuweudtylzszt.supabase.co";
  const SUPABASE_KEY = "sb_publishable_f4BiABsxLXgt7EdEE3yzyA_wmKGiYgP";
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const $ = id => document.getElementById(id);

  let uid = null, camps = [], cur = null, order = [];
  const R = 44;
  const SEGS = [["Andarilho","Caixa 1",2,0],["Caixa 1","Caixa 2",5,0],["Caixa 2","Circo",4,0],["Caixa 2","Armazém",4,0],["Circo","Cervo",6,40],["Cervo","Castelo",8,40],["Castelo","Fazenda",10,45],["Fazenda","Nuvens",10,0],["Armazém","Túnel de Cereal",6,-40],["Túnel de Cereal","Túnel de Vila",8,-40],["Túnel de Vila","Túnel de Floresta",10,-45],["Túnel de Floresta","Nuvens",10,0],["Circo","Sinaleiro",6,0],["Armazém","Sinaleiro",6,0],["Sinaleiro","Pastora",8,-40],["Pastora","Colina",10,45],["Colina","Nuvens",10,-45]];
  const HEART = new Set(["Cervo>Castelo","Túnel de Cereal>Túnel de Vila","Sinaleiro>Pastora"]);
  const POS = {"Andarilho":[440,800],"Caixa 1":[300,800],"Caixa 2":[300,650],"Circo":[490,650],"Armazém":[110,650],"Cervo":[490,505],"Sinaleiro":[300,505],"Túnel de Cereal":[110,505],"Castelo":[490,360],"Pastora":[300,360],"Túnel de Vila":[110,360],"Fazenda":[490,215],"Colina":[300,215],"Túnel de Floresta":[110,215],"Nuvens":[300,70]};
  function geo(f, t, n, bu) {
    const a = POS[f], b = POS[t], dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy);
    const cx = (a[0] + b[0]) / 2 + (-dy / L) * bu * 2, cy = (a[1] + b[1]) / 2 + (dx / L) * bu * 2;
    const P = [], cum = [0];
    for (let k = 0; k <= 400; k++) {
      const u = k / 400, w = 1 - u;
      P.push([w * w * a[0] + 2 * w * u * cx + u * u * b[0], w * w * a[1] + 2 * w * u * cy + u * u * b[1]]);
      if (k) cum.push(cum[k - 1] + Math.hypot(P[k][0] - P[k - 1][0], P[k][1] - P[k - 1][1]));
    }
    const rs = f === "Andarilho" ? 6 : R + 7, re = R + 7;
    let s0 = 0, e0 = 400, k;
    for (k = 0; k <= 400; k++) if (Math.hypot(P[k][0] - a[0], P[k][1] - a[1]) > rs) { s0 = k; break; }
    for (k = 400; k >= 0; k--) if (Math.hypot(P[k][0] - b[0], P[k][1] - b[1]) > re) { e0 = k; break; }
    const out = [];
    for (let i = 0; i < n; i++) {
      const tg = cum[s0] + (cum[e0] - cum[s0]) * (i + 0.5) / n;
      let j = 0; while (j < 400 && cum[j] < tg) j++;
      out.push(P[j]);
    }
    return out;
  }
  const CP = SEGS.map(([f, t, n, bu]) => geo(f, t, n, bu));
  const rotulo = h => (h.startsWith("Caixa") ? "Abra a|" + h : "Carta de|Conquista|" + h.replace("Túnel de ", "Túnel de|")).split("|");
  const NS = "http://www.w3.org/2000/svg";
  const el = (t, at, parent, txt) => { const e = document.createElementNS(NS, t); for (const k in at) e.setAttribute(k, at[k]); if (txt) e.textContent = txt; parent.appendChild(e); return e; };
  const cid = (f, t, i) => f + ">" + t + ":" + i;
  const nomeH = h => h.startsWith("Caixa") ? h : "Carta de Conquista " + h;

  function show(w) {
    $("out").classList.toggle("hide", w !== "out");
    $("in").classList.toggle("hide", w !== "in");
    $("board").classList.toggle("hide", w !== "board");
    document.querySelector("main").classList.toggle("wide", w === "board");
  }

  async function render(session) {
    if (!session) { uid = null; cur = null; show("out"); return; }
    const u = session.user;
    uid = u.id;
    $("nome").textContent = (u.user_metadata && (u.user_metadata.name || u.user_metadata.full_name)) || u.email;
    if (cur) return;
    show("in");
    await carregar();
  }

  async function carregar() {
    const { data, error } = await sb.from("campaigns").select("id,name,players,owner_id,state").order("created_at", { ascending: false });
    if (error) { $("camps").textContent = ""; $("msg").textContent = "Erro ao ler campanhas: " + error.message; return; }
    camps = data;
    $("camps").textContent = data.length ? "Toque numa campanha pra abrir o tabuleiro." : "Nenhuma campanha ainda.";
    const ul = $("lista");
    ul.innerHTML = "";
    data.forEach(c => {
      const li = document.createElement("li");
      li.className = "click";
      li.textContent = c.name;
      if (c.players) { const sm = document.createElement("small"); sm.textContent = c.players; li.appendChild(sm); }
      li.onclick = () => abrir(c);
      ul.appendChild(li);
    });
  }

  function abrir(c) {
    cur = c;
    order = (c.state && Array.isArray(c.state.marked)) ? c.state.marked.slice() : [];
    $("bt").textContent = c.name;
    $("msg").textContent = c.owner_id === uid ? "" : "Você é convidado: só visualiza.";
    show("board");
    draw();
  }

  function draw() {
    const M = new Set(order);
    const reached = h => h === "Andarilho" || SEGS.some(([f, t, n]) => t === h && M.has(cid(f, t, n - 1)));
    const canEdit = cur.owner_id === uid;
    const svg = $("svg");
    svg.innerHTML = "";
    SEGS.forEach(([f, t, n], si) => {
      const heart = HEART.has(f + ">" + t);
      for (let i = 0; i < n; i++) {
        const [x, y] = CP[si][i], id = cid(f, t, i), m = M.has(id);
        const av = !m && (i === 0 ? reached(f) : M.has(cid(f, t, i - 1)));
        const st = m ? " m" : av ? " a" : "";
        if (heart && i === 3) { el("circle", { cx: x, cy: y, r: 7, class: "heart" + st }, svg); el("text", { x: x, y: y + 3, class: "hx" }, svg, "♥"); }
        else el("circle", { cx: x, cy: y, r: 4, class: "dot" + st }, svg);
        if (av && canEdit) { const hit = el("circle", { cx: x, cy: y, r: 11, fill: "transparent", style: "cursor:pointer" }, svg); hit.onclick = () => marcar(id); }
      }
    });
    Object.keys(POS).forEach(h => {
      const [x, y] = POS[h];
      if (h === "Andarilho") {
        el("circle", { cx: x, cy: y, r: 9, fill: "#3b5ba8", stroke: "#fff", "stroke-width": 2 }, svg);
        el("text", { x: x, y: y + 26, class: "lbl" }, svg, "Andarilho");
        return;
      }
      const pts = [[0,-R],[38,-22],[38,22],[0,R],[-38,22],[-38,-22]].map(q => (x + q[0]) + "," + (y + q[1])).join(" ");
      el("polygon", { points: pts, class: "hex" + (reached(h) ? " u" : "") }, svg);
      const ls = rotulo(h), y0 = y - (ls.length - 1) * 5.5 + 3;
      ls.forEach((tx, i) => el("text", { x: x, y: y0 + i * 11, class: "t" }, svg, tx));
    });
    const hearts = order.filter(id => HEART.has(id.split(":")[0]) && id.endsWith(":3")).length;
    const desb = Object.keys(POS).filter(h => h !== "Andarilho" && reached(h)).map(nomeH);
    $("info").innerHTML = "";
    const l1 = document.createElement("p"); l1.textContent = "Círculos: " + order.length + "/123 · Corações: " + hearts + "/3"; $("info").appendChild(l1);
    const l2 = document.createElement("p"); l2.textContent = "Desbloqueados: " + (desb.length ? desb.join(", ") : "nada ainda"); $("info").appendChild(l2);
    $("undo").classList.toggle("hide", !canEdit);
  }

  async function salvar(antes) {
    const { error } = await sb.from("campaigns").update({ state: { marked: order } }).eq("id", cur.id);
    if (error) { order = antes; $("msg").textContent = "Erro ao salvar: " + error.message; }
    else { cur.state = { marked: order.slice() }; $("msg").textContent = ""; }
    draw();
  }
  async function marcar(id) { const antes = order.slice(); order.push(id); draw(); await salvar(antes); }
  $("undo").onclick = async () => { if (!order.length) return; const antes = order.slice(); order.pop(); draw(); await salvar(antes); };
  $("back").onclick = async () => { cur = null; $("msg").textContent = ""; show("in"); await carregar(); };

  $("criar").onclick = async () => {
    $("msg").textContent = "";
    const name = $("cnome").value.trim();
    if (!name) { $("msg").textContent = "Dê um nome à campanha."; return; }
    const { error } = await sb.from("campaigns").insert({ game: "dorf-romantik", name, players: $("cjog").value.trim() || null });
    if (error) { $("msg").textContent = "Erro ao criar: " + error.message; return; }
    $("cnome").value = ""; $("cjog").value = "";
    await carregar();
  };

  $("login").onclick = async () => {
    $("msg").textContent = "";
    const { error } = await sb.auth.signInWithOAuth({
      provider: "google",
      options: { redirectTo: location.origin + location.pathname }
    });
    if (error) $("msg").textContent = error.message;
  };
  $("logout").onclick = () => sb.auth.signOut();

  sb.auth.onAuthStateChange((_e, session) => render(session));
  sb.auth.getSession().then(({ data }) => render(data.session));
</script>
</body>
</html>
